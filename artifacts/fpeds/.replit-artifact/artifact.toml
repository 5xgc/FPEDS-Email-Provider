kind = "web"
previewPath = "/"
title = "MoralTown Mail"
description = "A focused email workspace with individual mailboxes, access-key sign-in, and one-time lifetime access by confirmed BTC, SOL, ETH, or LTC payment. Email delivery and network metadata involve external services."
version = "1.0.0"
id = "artifacts/fpeds"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/fpeds run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fpeds", "run", "build" ]
serve = "static"
publicDir = "dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"