kind = "web"
previewPath = "/"
title = "FPEDS Mail"
description = "A secure, privacy-first email workspace for fpeds.2bd.net with access-key accounts, local mailbox storage, folders, subscriptions, SMTP sending, and Cloudflare inbound delivery."
version = "1.0.0"
id = "artifacts/fpeds"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/fpeds run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fpeds", "run", "build" ]
serve = "static"
publicDir = "artifacts/fpeds/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
