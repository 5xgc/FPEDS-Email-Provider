openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Access-key authentication and account setup
  - name: mailbox
    description: Mailbox, folders, and message operations
  - name: settings
    description: Mailbox preferences and subscriptions
  - name: notifications
    description: User notifications
  - name: payments
    description: One-time crypto payment requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /security/captcha:
    get:
      operationId: createSecurityChallenge
      tags: [health]
      summary: Issue a short-lived human-check challenge
      responses:
        "200":
          description: One-use challenge for a public authentication action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityChallenge"
  /site/status:
    get:
      operationId: getSiteStatus
      tags: [health]
      summary: Read the public lockdown and announcement state
      responses:
        "200":
          description: Public site state without configuration details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSiteStatus"
  /security/check:
    get:
      operationId: getSecurityCheck
      tags: [health]
      summary: Read authenticated service readiness and API route status
      responses:
        "200":
          description: Safe service status, API route inventory, and warnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityCheck"
        "401":
          description: Sign in required
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [health]
      summary: Read aggregate privacy-safe operations analytics
      responses:
        "200":
          description: Admin analytics and operating controls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Sign in required
        "403":
          description: Admin or co-founder permission required
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [auth]
      summary: List account identities and roles for authorized operators
      responses:
        "200":
          description: Account directory without access keys or mailbox contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDirectory"
        "401":
          description: Sign in required
        "403":
          description: Admin or co-founder permission required
  /admin/users/{user_id}:
    patch:
      operationId: updateAdminUserRole
      tags: [auth]
      summary: Change an account role
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserRoleUpdate"
      responses:
        "200":
          description: Updated account role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserUpdateResult"
        "401":
          description: Sign in required
        "403":
          description: Admin account required
  /admin/control:
    post:
      operationId: updateAdminControl
      tags: [health]
      summary: Change lockdown, API, sending, or receiving state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminControlInput"
      responses:
        "200":
          description: Updated operating state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminControlResult"
        "401":
          description: Sign in required
        "403":
          description: Admin or co-founder permission required
  /admin/announcement:
    post:
      operationId: updateAdminAnnouncement
      tags: [health]
      summary: Publish or clear a public service announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAnnouncementInput"
      responses:
        "200":
          description: Current announcement state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnnouncementResult"
        "401":
          description: Sign in required
        "403":
          description: Admin or co-founder permission required
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create a MoralTown account with a free access code or verified purchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid access key or username
        "402":
          description: A valid access code or confirmed payment is required
  /auth/check-access-code:
    post:
      operationId: checkAccessCode
      tags: [auth]
      summary: Check whether a provided free access code is valid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessCodeCheckInput"
      responses:
        "200":
          description: Access code validity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCodeCheckResult"
  /payments/orders:
    post:
      operationId: createPaymentOrder
      tags: [payments]
      summary: Create a one-time crypto payment request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentOrderInput"
      responses:
        "201":
          description: Payment address and exact amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "400":
          description: Unsupported currency or invalid contact email
        "409":
          description: Contact email already has a paid account
        "503":
          description: Quote or payment provider unavailable
  /payments/claims/validate:
    get:
      operationId: validatePaymentClaim
      tags: [payments]
      summary: Check whether a confirmed payment claim link is still usable
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Claim link validity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentClaimValidation"
  /payments/orders/{order_id}:
    get:
      operationId: getPaymentOrder
      tags: [payments]
      summary: Check the current state of a payment request
      parameters:
        - $ref: "#/components/parameters/PaymentOrderId"
      responses:
        "200":
          description: Payment request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "404":
          description: Payment request not found
  /payments/orders/{order_id}/sent:
    post:
      operationId: markPaymentSent
      tags: [payments]
      summary: Start checking the public chain after the buyer sends payment
      parameters:
        - $ref: "#/components/parameters/PaymentOrderId"
      responses:
        "200":
          description: Payment request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "404":
          description: Payment request not found
  /auth/signin:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in with an access key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInput"
      responses:
        "200":
          description: Signed-in session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Access key rejected
  /auth/signout:
    post:
      operationId: signOut
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Signed out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the current account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not signed in
  /auth/access-key:
    get:
      operationId: getAccessKey
      tags: [auth]
      summary: Reveal the encrypted access key for the current account
      responses:
        "200":
          description: Access key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKey"
        "401":
          description: Not signed in
        "409":
          description: Legacy account requires a key refresh
  /auth/rotate-key:
    post:
      operationId: rotateAccessKey
      tags: [auth]
      summary: Rotate the access key for the current account
      responses:
        "200":
          description: Rotated access key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotatedAccessKey"
        "401":
          description: Not signed in
  /auth/profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Change the display name or mailbox address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid change or annual limit reached
  /mailboxes:
    get:
      operationId: listMailboxAccounts
      tags: [mailbox]
      summary: List mailboxes attached to the signed-in access key
      responses:
        "200":
          description: Mailboxes available to this account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MailboxAccount"
        "401":
          description: Not signed in
    post:
      operationId: createMailboxAccount
      tags: [mailbox]
      summary: Create another mailbox under the existing account access key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMailboxAccountInput"
      responses:
        "201":
          description: Created mailbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxAccount"
        "400":
          description: Invalid mailbox name
        "409":
          description: Mailbox name already exists
        "401":
          description: Not signed in
  /mailboxes/switch:
    post:
      operationId: switchMailboxAccount
      tags: [mailbox]
      summary: Switch the current session to another mailbox on this account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailboxSwitchInput"
      responses:
        "200":
          description: Active mailbox changed
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "404":
          description: Mailbox is not part of this account
        "401":
          description: Not signed in
  /mailbox/summary:
    get:
      operationId: getMailboxSummary
      tags: [mailbox]
      summary: Return mailbox counts and activity
      responses:
        "200":
          description: Mailbox summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxSummary"
  /messages:
    get:
      operationId: listMessages
      tags: [mailbox]
      summary: List messages for a folder
      parameters:
        - name: folder
          in: query
          required: false
          schema:
            type: string
            default: inbox
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [mailbox]
      summary: Send a message through the Brevo transactional email API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid recipient or message
  /messages/{id}:
    get:
      operationId: getMessage
      tags: [mailbox]
      summary: Read a single message
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Message not found
    patch:
      operationId: updateMessage
      tags: [mailbox]
      summary: Update read state or move a message
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageUpdate"
      responses:
        "200":
          description: Updated message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /folders:
    get:
      operationId: listFolders
      tags: [mailbox]
      summary: List mailbox folders
      responses:
        "200":
          description: Folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Folder"
    post:
      operationId: createFolder
      tags: [mailbox]
      summary: Create a folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolderInput"
      responses:
        "201":
          description: Folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Folder"
  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [settings]
      summary: List email subscriptions
      responses:
        "200":
          description: Subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [settings]
      summary: Subscribe to an email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List recent notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "204":
          description: Marked read
  /webhook/inbound:
    post:
      operationId: receiveInboundWebhook
      tags: [mailbox]
      summary: Receive inbound mail from Cloudflare Email Routing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundWebhook"
      responses:
        "202":
          description: Accepted
components:
  parameters:
    MessageId:
      name: id
      in: path
      required: true
      schema:
        type: string
    NotificationId:
      name: id
      in: path
      required: true
      schema:
        type: string
    PaymentOrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SignUpInput:
      type: object
      required: [accessKey, username, captchaToken, captchaAnswer]
      properties:
        accessKey:
          type: string
          minLength: 50
          maxLength: 50
        username:
          type: string
          minLength: 1
          maxLength: 40
        accessCode:
          type: string
          maxLength: 100
        purchaseToken:
          type: string
          maxLength: 256
        claimToken:
          type: string
          maxLength: 128
        captchaToken:
          type: string
          minLength: 16
          maxLength: 128
        captchaAnswer:
          type: string
          pattern: '^\d{1,3}$'
    AccessCodeCheckInput:
      type: object
      required: [accessCode, captchaToken, captchaAnswer]
      properties:
        accessCode: { type: string, maxLength: 100 }
        captchaToken: { type: string, minLength: 16, maxLength: 128 }
        captchaAnswer: { type: string, pattern: '^\d{1,3}$' }
    AccessCodeCheckResult:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
    PaymentOrderInput:
      type: object
      required: [currency, email]
      properties:
        currency:
          type: string
          enum: [BTC, SOL, ETH, LTC]
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s.]+(?:\.[^@\s.]+)+$'
          maxLength: 254
    PaymentClaimValidation:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
    PaymentOrder:
      type: object
      required: [id, currency, address, amount, usdPrice, status, confirmations, requiredConfirmations, expiresAt, confirmationEmailSent]
      properties:
        id: { type: string }
        currency: { type: string, enum: [BTC, SOL, ETH, LTC] }
        address: { type: string }
        amount: { type: string }
        usdPrice: { type: string }
        status: { type: string, enum: [pending, checking, confirming, confirmed, expired] }
        confirmations: { type: number }
        requiredConfirmations: { type: number }
        expiresAt: { type: number }
        transactionId: { type: [string, "null"] }
        purchaseToken: { type: string }
        confirmationEmailSent: { type: boolean }
    SignInInput:
      type: object
      required: [accessKey, captchaToken, captchaAnswer]
      properties:
        accessKey:
          type: string
          minLength: 50
          maxLength: 50
        captchaToken: { type: string, minLength: 16, maxLength: 128 }
        captchaAnswer: { type: string, pattern: '^\d{1,3}$' }
        adminOnly: { type: boolean, default: false }
    AuthSession:
      type: object
      required: [user, firstLogin]
      properties:
        user:
          $ref: "#/components/schemas/User"
        firstLogin:
          type: boolean
    AccessKey:
      type: object
      required: [accessKey]
      properties:
        accessKey: { type: string, minLength: 50, maxLength: 50 }
    RotatedAccessKey:
      type: object
      required: [accessKey, rotatedAt]
      properties:
        accessKey: { type: string, minLength: 50, maxLength: 50 }
        rotatedAt: { type: string, format: date-time }
    User:
      type: object
      required: [id, username, email, createdAt, emailChangesRemaining, role]
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        createdAt: { type: string, format: date-time }
        emailChangesRemaining: { type: number }
        role: { type: string, enum: [user, soldier, moraltown, admin, co_founder, og, fed] }
    MailboxAccount:
      type: object
      required: [id, username, email, createdAt, isCurrent]
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        createdAt: { type: string, format: date-time }
        isCurrent: { type: boolean }
    CreateMailboxAccountInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
    MailboxSwitchInput:
      type: object
      required: [mailboxId]
      properties:
        mailboxId: { type: string, minLength: 1 }
    SecurityChallenge:
      type: object
      required: [token, question, expiresAt]
      properties:
        token: { type: string }
        question: { type: string }
        expiresAt: { type: number }
    PublicSiteStatus:
      type: object
      required: [lockdown, lockdownMessage, announcement]
      properties:
        lockdown: { type: boolean }
        lockdownMessage: { type: string }
        announcement:
          anyOf:
            - $ref: "#/components/schemas/SiteAnnouncement"
            - type: "null"
    SiteAnnouncement:
      type: object
      required: [message, updatedAt]
      properties:
        message: { type: string, maxLength: 500 }
        updatedAt: { type: string, format: date-time }
    SecurityService:
      type: object
      required: [id, name, active, detail]
      properties:
        id: { type: string }
        name: { type: string }
        active: { type: boolean }
        detail: { type: string }
    SecurityRoute:
      type: object
      required: [path, methods, active]
      properties:
        path: { type: string }
        methods: { type: array, items: { type: string } }
        active: { type: boolean }
    SecurityCheck:
      type: object
      required: [mailboxReady, lockdown, lockdownMessage, apiPaused, announcement, warnings, services, routes]
      properties:
        mailboxReady: { type: boolean }
        lockdown: { type: boolean }
        lockdownMessage: { type: string }
        apiPaused: { type: boolean }
        announcement:
          anyOf:
            - $ref: "#/components/schemas/SiteAnnouncement"
            - type: "null"
        warnings: { type: array, items: { type: string } }
        services: { type: array, items: { $ref: "#/components/schemas/SecurityService" } }
        routes: { type: array, items: { $ref: "#/components/schemas/SecurityRoute" } }
    AdminSeriesPoint:
      type: object
      required: [date, count]
      properties:
        date: { type: string, format: date }
        count: { type: number }
    AdminAuditEvent:
      type: object
      required: [action, actor, createdAt]
      properties:
        action: { type: string }
        actor: { type: string }
        createdAt: { type: string, format: date-time }
    AdminOverview:
      type: object
      required: [totals, series, controls, announcement, audit]
      properties:
        totals:
          type: object
          required: [users, sentToday, receivedToday]
          properties:
            users: { type: number }
            sentToday: { type: number }
            receivedToday: { type: number }
        series:
          type: object
          required: [accounts, messages]
          properties:
            accounts: { type: array, items: { $ref: "#/components/schemas/AdminSeriesPoint" } }
            messages: { type: array, items: { $ref: "#/components/schemas/AdminSeriesPoint" } }
        controls:
          $ref: "#/components/schemas/OperatingControls"
        announcement:
          anyOf:
            - $ref: "#/components/schemas/SiteAnnouncement"
            - type: "null"
        audit: { type: array, items: { $ref: "#/components/schemas/AdminAuditEvent" } }
    OperatingControls:
      type: object
      required: [lockdown, lockdownMessage, apiPaused, sendingEnabled, receivingEnabled]
      properties:
        lockdown: { type: boolean }
        lockdownMessage: { type: string }
        apiPaused: { type: boolean }
        sendingEnabled: { type: boolean }
        receivingEnabled: { type: boolean }
    AdminUser:
      type: object
      required: [id, username, email, role, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        role: { type: string, enum: [user, soldier, moraltown, admin, co_founder, og, fed] }
        createdAt: { type: string, format: date-time }
    AdminUserDirectory:
      type: object
      required: [users]
      properties:
        users: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
    AdminUserRoleUpdate:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [user, soldier, moraltown, admin, co_founder, og, fed] }
    AdminUserUpdateResult:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
    AdminControlInput:
      type: object
      required: [key, enabled]
      properties:
        key: { type: string, enum: [lockdown, apiPaused, sendingEnabled, receivingEnabled] }
        enabled: { type: boolean }
        message: { type: string, maxLength: 500 }
    AdminControlResult:
      type: object
      required: [controls]
      properties:
        controls: { $ref: "#/components/schemas/OperatingControls" }
    AdminAnnouncementInput:
      type: object
      required: [message]
      properties:
        message: { type: string, maxLength: 500 }
    AdminAnnouncementResult:
      type: object
      required: [announcement]
      properties:
        announcement:
          anyOf:
            - $ref: "#/components/schemas/SiteAnnouncement"
            - type: "null"
    ProfileUpdate:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 40
    MailboxSummary:
      type: object
      required: [unread, inbox, sent, spam, drafts, folders, notifications]
      properties:
